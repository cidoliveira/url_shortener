<div class="flex flex-col items-center justify-center content-center min-h-screen gap-10">
<h1 class="text-2xl font-bold font-mono">Url Shortener</h1>

  <div class="flex gap-10">
<input
  class="border-2 p-2 rounded-sm"
  type="text" required
  [(ngModel)]="url"
  placeholder="https://example.com"
>

<button class="border-2 p-2 px-10"  (click)="shortenUrl()">
  Shorten Url
</button>
  </div>

<a href="{{shortUrl()}}">{{ shortUrl() }}</a>
</div>
