<div class="flex flex-col items-center justify-center content-center min-h-screen">
<h1>Url Shortener</h1>

  <div>
<input
  type="text"
  [(ngModel)]="url"
  placeholder="https://example.com"
>

<button (click)="shortenUrl()">
  Shorten Url
</button>
  </div>

<a href="{{shortUrl()}}">{{ shortUrl() }}</a>
</div>
